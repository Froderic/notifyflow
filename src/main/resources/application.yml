spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/notifyflow
    username: notifyflow
    password: notifyflow
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: notifyflow-default
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.wooseok.notifyflow.dto"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
  docker:
    compose:
      enabled: false
  springdoc:
    swagger-ui:
      path: /swagger-ui.html
    api-docs:
      path: /v3/api-docs

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info
  endpoint:
    health:
      show-details: always
  health:
    kafka:
      enabled: true
  info:
    env:
      enabled: true

info:
  app:
    name: NotifyFlow
    description: Event-driven Kafka notification platform
    version: 1.0.0

logging:
  pattern:
    console: "%d{HH:mm:ss} [%thread] %-5level [eventId=%X{eventId}] [eventType=%X{eventType}] %logger{36} - %msg%n"