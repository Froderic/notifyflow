services:
  kafka:
    image: apache/kafka:3.9.0
    container_name: notifyflow-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: notifyflow-cluster-001

  postgres:
    image: postgres:17
    container_name: notifyflow-postgres
    environment:
      POSTGRES_DB: notifyflow
      POSTGRES_USER: notifyflow
      POSTGRES_PASSWORD: notifyflow
    ports:
      - "5432:5432"
    volumes:
      - notifyflow-pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: notifyflow-redis
    ports:
      - "6379:6379"

volumes:
  notifyflow-pgdata: